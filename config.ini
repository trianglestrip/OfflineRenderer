# libVLRW Renderer Configuration

[Scene]
# Scene type: "rgb_room" or "classic"
type = classic

[Render]
# Samples per pixel (higher = less noise, slower)
spp = 16

# Enable OptiX denoiser (reduces noise without high spp)
denoiser = true

# Maximum ray bounce depth (increased for better indirect illumination)
maxDepth = 12

# Image resolution
width = 512
height = 512

[Camera]
# Camera position (x, y, z)
position = 0.0, 1.0, 0.6

# Look at target (x, y, z)
target = 0.0, 1.0, -0.5

# Up vector (x, y, z)
up = 0.0, 1.0, 0.0

# Field of view (degrees)
fov = 60.0

[Light]
# Light type: "point", "area", or "both"
type = area

# Point light (used when type=point or type=both)
position = 0.0, 1.8, 0.0
intensity = 5.0, 5.0, 5.0

# Area light - ceiling (used when type=area or type=both)
# Center position (x, y, z) - ceiling center
areaPosition = 0.0, 2.0, 0.0
# Normal (points down into room)
areaNormal = 0.0, -1.0, 0.0
# Tangent (along one edge)
areaTangent = 1.0, 0.0, 0.0
# Width and height of rectangle
areaWidth = 1.0
areaHeight = 1.0
# Emission radiance (r, g, b)
areaEmission = 8.0, 8.0, 8.0
# Double-sided (emit from both sides): true/false
areaDoubleSided = false
