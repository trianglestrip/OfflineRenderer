; Shared render settings for libOptixW tests.
; Each section can override default width/height/spp.

[default]
width = 512
height = 512
spp = 16
denoiser = 1
blend = 0.5
# tile size 0 disables tiling; try 128 to exercise tiled denoiser
tiling = 0
tileWidth = 128
 tileHeight = 128

[cornell_box]
spp = 64
denoiser = 1

[cornell_box_var]
# originally disabled; enable and try blending/tiles as desired
spp = 16
denoiser = 1
blend = 0.0
# ensure tiling disabled for this run
tiling = 0
tileWidth = 0
tileHeight = 0
